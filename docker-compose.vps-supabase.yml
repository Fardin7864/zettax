name: primevest

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-environment: &backend-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_SSL: "false"
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
  MINIO_EVIDENCE_BUCKET: primevest-evidence
  EVIDENCE_ENCRYPTION_KEY_FILE: /run/secrets/evidence.key
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  JWT_ACCESS_TTL_SECONDS: "900"
  JWT_REFRESH_TTL_DAYS: "30"
  GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:?GOOGLE_WEB_CLIENT_ID is required}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID is required}
  WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?WEBAUTHN_ORIGIN is required}
  RELEASE_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION is required}
  COMPLIANCE_MODE: ${COMPLIANCE_MODE:-DEMO_ONLY}
  ENABLE_REAL_TRADING: ${ENABLE_REAL_TRADING:-false}
  ENABLE_CRYPTO_TRADING: ${ENABLE_CRYPTO_TRADING:-false}
  ENABLE_FOREX_TRADING: ${ENABLE_FOREX_TRADING:-false}
  ENABLE_STOCK_TRADING: ${ENABLE_STOCK_TRADING:-false}
  ENABLE_COMMODITY_TRADING: ${ENABLE_COMMODITY_TRADING:-false}
  ENABLE_INDEX_TRADING: ${ENABLE_INDEX_TRADING:-false}
  ENABLE_TIMED_TRADING: ${ENABLE_TIMED_TRADING:-true}
  ENABLE_DEPOSITS: ${ENABLE_DEPOSITS:-false}
  ENABLE_WITHDRAWALS: ${ENABLE_WITHDRAWALS:-false}
  EXECUTION_PROVIDER: ${EXECUTION_PROVIDER:-MOCK}
  TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
  TWELVE_DATA_DISPLAY_LICENSE_APPROVED: ${TWELVE_DATA_DISPLAY_LICENSE_APPROVED:-false}

services:
  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command:
      [
        "/bin/sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - /srv/primevest/data/redis:/data
    networks: [data]
    user: "999:1000"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *bounded-logging

  minio:
    image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - /srv/primevest/data/minio:/data
    networks: [data]
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 0.75
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *bounded-logging

  clamav:
    image: clamav/clamav@sha256:1fdfd24c6f0a0fb60788481487459a6d4eda8a9b448641594e04db8410d34422
    volumes:
      - /srv/primevest/data/clamav:/var/lib/clamav
    networks: [data, app]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    logging: *bounded-logging

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    image: primevest-backend:${RELEASE_VERSION:?RELEASE_VERSION is required}
    environment: *backend-environment
    ports:
      - 127.0.0.1:4200:3000
    volumes:
      - /srv/primevest/secrets/evidence.key:/run/secrets/evidence.key:ro
      - /srv/primevest/secrets/supabase-ca.crt:/run/secrets/supabase-ca.crt:ro
    networks: [app, data]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamav: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *bounded-logging

  financial-worker:
    image: primevest-backend:${RELEASE_VERSION:?RELEASE_VERSION is required}
    environment: *backend-environment
    command:
      [
        "node",
        "/workspace/apps/backend/dist/apps/backend/src/workers/financial-worker.js",
      ]
    volumes:
      - /srv/primevest/secrets/evidence.key:/run/secrets/evidence.key:ro
      - /srv/primevest/secrets/supabase-ca.crt:/run/secrets/supabase-ca.crt:ro
    networks: [data, app]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 192
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    logging: *bounded-logging

networks:
  app: {}
  data:
    internal: true
