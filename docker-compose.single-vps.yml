x-operations-logging: &operations-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-environment: &backend-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@pgbouncer:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public&pgbouncer=true&connection_limit=20
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
  MINIO_ENDPOINT: minio
  MINIO_PORT: 9000
  MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
  MINIO_EVIDENCE_BUCKET: ${MINIO_PAYMENT_BUCKET:-primevest-payments}
  EVIDENCE_ENCRYPTION_KEY_FILE: /run/secrets/evidence.key
  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID is required}
  WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?WEBAUTHN_ORIGIN is required}
  RELEASE_VERSION: ${APP_VERSION:?APP_VERSION is required}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
  AUTH_MAX_FAILED_LOGINS: ${AUTH_MAX_FAILED_LOGINS:-5}
  AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES:-15}
  GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
  COMPLIANCE_MODE: ${COMPLIANCE_MODE:-DEMO_ONLY}
  ENABLE_REAL_TRADING: ${ENABLE_REAL_TRADING:-false}
  ENABLE_CRYPTO_TRADING: ${ENABLE_CRYPTO_TRADING:-false}
  ENABLE_FOREX_TRADING: ${ENABLE_FOREX_TRADING:-false}
  ENABLE_STOCK_TRADING: ${ENABLE_STOCK_TRADING:-false}
  ENABLE_COMMODITY_TRADING: ${ENABLE_COMMODITY_TRADING:-false}
  ENABLE_INDEX_TRADING: ${ENABLE_INDEX_TRADING:-false}
  ENABLE_TIMED_TRADING: ${ENABLE_TIMED_TRADING:-false}
  ENABLE_DEPOSITS: ${ENABLE_DEPOSITS:-false}
  ENABLE_WITHDRAWALS: ${ENABLE_WITHDRAWALS:-false}
  EXECUTION_PROVIDER: ${EXECUTION_PROVIDER:-MOCK}
  PRODUCTION_APPROVAL_REFERENCE: ${PRODUCTION_APPROVAL_REFERENCE:-}
  EXECUTION_PROVIDER_APPROVAL_REFERENCE: ${EXECUTION_PROVIDER_APPROVAL_REFERENCE:-}
  TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
  TWELVE_DATA_DISPLAY_LICENSE_APPROVED: ${TWELVE_DATA_DISPLAY_LICENSE_APPROVED:-false}
  TWELVE_DATA_REQUESTS_PER_MINUTE: ${TWELVE_DATA_REQUESTS_PER_MINUTE:-8}
  MARKET_DATA_CACHE_MAX_ENTRIES: ${MARKET_DATA_CACHE_MAX_ENTRIES:-500}

x-backend-runtime: &backend-runtime
  image: primevest-backend:${APP_VERSION:?APP_VERSION is required}
  environment: *backend-environment
  command: ["node", "apps/backend/dist/apps/backend/src/main.js"]
  networks: [app, data, operations]
  user: "1000:1000"
  volumes: !override
    - ${PRIMEVEST_DATA_ROOT:?PRIMEVEST_DATA_ROOT is required}/secrets/evidence.key:/run/secrets/evidence.key:ro
  read_only: true
  tmpfs: !override
    - /tmp:rw,noexec,nosuid,size=128m
  security_opt: !override [no-new-privileges:true]
  cap_drop: !override [ALL]
  pids_limit: 512
  mem_limit: 4g
  cpus: 2.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/ready"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 60s
  logging: *operations-logging
  depends_on:
    database-grants:
      condition: service_completed_successfully
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

x-financial-worker: &financial-worker
  image: primevest-backend:${APP_VERSION:?APP_VERSION is required}
  environment: *backend-environment
  command:
    ["node", "apps/backend/dist/apps/backend/src/workers/financial-worker.js"]
  networks: [data, operations]
  user: "1000:1000"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 256
  mem_limit: 3g
  cpus: 1.0
  restart: unless-stopped
  depends_on:
    database-grants:
      condition: service_completed_successfully
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: *operations-logging

services:
  financial-worker-a:
    <<: *financial-worker

  financial-worker-b:
    <<: *financial-worker

  postgres:
    image: primevest-postgres:${APP_VERSION:?APP_VERSION is required}
    build:
      context: .
      dockerfile: infrastructure/docker/postgres.Dockerfile
    environment:
      PGBACKREST_PG1_PATH: /var/lib/postgresql/data
      PGBACKREST_REPO1_TYPE: s3
      PGBACKREST_REPO1_PATH: /postgres
      PGBACKREST_REPO1_S3_BUCKET: ${PGBACKREST_S3_BUCKET:?PGBACKREST_S3_BUCKET is required}
      PGBACKREST_REPO1_S3_ENDPOINT: ${PGBACKREST_S3_ENDPOINT:?PGBACKREST_S3_ENDPOINT is required}
      PGBACKREST_REPO1_S3_REGION: ${PGBACKREST_S3_REGION:?PGBACKREST_S3_REGION is required}
      PGBACKREST_REPO1_S3_KEY: ${PGBACKREST_S3_KEY:?PGBACKREST_S3_KEY is required}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${PGBACKREST_S3_KEY_SECRET:?PGBACKREST_S3_KEY_SECRET is required}
      PGBACKREST_REPO1_S3_URI_STYLE: path
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?PGBACKREST_CIPHER_PASS is required}
      PGBACKREST_REPO1_RETENTION_FULL: 12
      PGBACKREST_REPO1_RETENTION_DIFF: 14
      PGBACKREST_PROCESS_MAX: 4
      PGBACKREST_START_FAST: "y"
    command:
      - postgres
      - -c
      - fsync=on
      - -c
      - full_page_writes=on
      - -c
      - synchronous_commit=on
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=240s
      - -c
      - archive_command=pgbackrest --stanza=primevest archive-push %p
      - -c
      - max_connections=200
      - -c
      - shared_buffers=8GB
      - -c
      - effective_cache_size=16GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - log_min_duration_statement=500
    shm_size: 2g
    mem_limit: 20g
    cpus: 6.0
    pids_limit: 512
    networks: [data, operations]
    volumes:
      - ${PRIMEVEST_DATA_ROOT:?PRIMEVEST_DATA_ROOT is required}/postgres:/var/lib/postgresql/data

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p0
    user: "70:70"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 80
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 20
      SERVER_RESET_QUERY: DISCARD ALL
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U $$DB_USER -d $$DB_NAME",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      database-roles:
        condition: service_completed_successfully
    logging: *operations-logging

  redis:
    command:
      - /bin/sh
      - -eu
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD" --maxmemory 3gb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10
    mem_limit: 4g
    cpus: 1.0
    pids_limit: 256
    networks: [data, operations]
    volumes:
      - ${PRIMEVEST_DATA_ROOT:?PRIMEVEST_DATA_ROOT is required}/redis:/data

  minio:
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512
    networks: [data, operations]
    volumes:
      - ${PRIMEVEST_DATA_ROOT:?PRIMEVEST_DATA_ROOT is required}/minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
        mc mb --ignore-existing local/"$$MINIO_KYC_BUCKET";
        mc mb --ignore-existing local/"$$MINIO_PAYMENT_BUCKET";
        mc mb --ignore-existing local/"$$MINIO_REPORTS_BUCKET";
        mc mb --ignore-existing local/"$$MINIO_UPLOADS_BUCKET";
        mc anonymous set none local/"$$MINIO_KYC_BUCKET";
        mc anonymous set none local/"$$MINIO_PAYMENT_BUCKET";
        mc anonymous set none local/"$$MINIO_REPORTS_BUCKET";
        mc anonymous set none local/"$$MINIO_UPLOADS_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_KYC_BUCKET: ${MINIO_KYC_BUCKET:-primevest-kyc}
      MINIO_PAYMENT_BUCKET: ${MINIO_PAYMENT_BUCKET:-primevest-payments}
      MINIO_REPORTS_BUCKET: ${MINIO_REPORTS_BUCKET:-primevest-reports}
      MINIO_UPLOADS_BUCKET: ${MINIO_UPLOADS_BUCKET:-primevest-uploads}
    volumes:
      - ${PRIMEVEST_DATA_ROOT:?PRIMEVEST_DATA_ROOT is required}/backups:/backup
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    logging: *operations-logging

  clamav:
    image: clamav/clamav:1.4.3
    command: ["clamd", "--foreground=true"]
    user: "100:101"
    networks: [data, operations]
    volumes:
      - ${PRIMEVEST_DATA_ROOT:?PRIMEVEST_DATA_ROOT is required}/clamav:/var/lib/clamav
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /run/clamav:rw,noexec,nosuid,size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 3g
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "printf 'PING\\n' | nc -w 3 127.0.0.1 3310 | grep -q PONG",
        ]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 180s
    logging: *operations-logging

  clamav-updater:
    image: clamav/clamav:1.4.3
    command: ["freshclam", "--daemon", "--foreground"]
    user: "100:101"
    networks: [edge]
    volumes:
      - ${PRIMEVEST_DATA_ROOT:?PRIMEVEST_DATA_ROOT is required}/clamav:/var/lib/clamav
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/clamav:rw,noexec,nosuid,size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 1g
    cpus: 0.25
    restart: unless-stopped
    logging: *operations-logging

  migrate:
    image: primevest-backend:${APP_VERSION:?APP_VERSION is required}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_MIGRATION_USER:?POSTGRES_MIGRATION_USER is required}:${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
    command:
      - /bin/sh
      - -eu
      - -c
      - cd /workspace/apps/backend && ./node_modules/.bin/prisma migrate deploy && ./node_modules/.bin/tsx prisma/seed.ts
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    restart: "no"
    depends_on:
      database-roles:
        condition: service_completed_successfully
    logging: *operations-logging

  database-roles:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:?POSTGRES_MIGRATION_USER is required}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}
      POSTGRES_MONITOR_USER: ${POSTGRES_MONITOR_USER:?POSTGRES_MONITOR_USER is required}
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:?POSTGRES_MONITOR_PASSWORD is required}
    command:
      - /bin/sh
      - -eu
      - -c
      - >-
        psql
        --set=app_user="$$POSTGRES_APP_USER"
        --set=app_password="$$POSTGRES_APP_PASSWORD"
        --set=migration_user="$$POSTGRES_MIGRATION_USER"
        --set=migration_password="$$POSTGRES_MIGRATION_PASSWORD"
        --set=monitor_user="$$POSTGRES_MONITOR_USER"
        --set=monitor_password="$$POSTGRES_MONITOR_PASSWORD"
        --set=owner_user="$$PGUSER"
        --file=/sql/create-roles.sql
    volumes:
      - ./infrastructure/single-vps/create-roles.sql:/sql/create-roles.sql:ro
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.25
    restart: "no"
    depends_on:
      pgbackrest-init:
        condition: service_completed_successfully
    logging: *operations-logging

  pgbackrest-init:
    image: primevest-postgres:${APP_VERSION:?APP_VERSION is required}
    environment:
      PGBACKREST_PG1_PATH: /var/lib/postgresql/data
      PGBACKREST_REPO1_TYPE: s3
      PGBACKREST_REPO1_PATH: /postgres
      PGBACKREST_REPO1_S3_BUCKET: ${PGBACKREST_S3_BUCKET:?PGBACKREST_S3_BUCKET is required}
      PGBACKREST_REPO1_S3_ENDPOINT: ${PGBACKREST_S3_ENDPOINT:?PGBACKREST_S3_ENDPOINT is required}
      PGBACKREST_REPO1_S3_REGION: ${PGBACKREST_S3_REGION:?PGBACKREST_S3_REGION is required}
      PGBACKREST_REPO1_S3_KEY: ${PGBACKREST_S3_KEY:?PGBACKREST_S3_KEY is required}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${PGBACKREST_S3_KEY_SECRET:?PGBACKREST_S3_KEY_SECRET is required}
      PGBACKREST_REPO1_S3_URI_STYLE: path
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?PGBACKREST_CIPHER_PASS is required}
      PGBACKREST_REPO1_RETENTION_FULL: 12
      PGBACKREST_REPO1_RETENTION_DIFF: 14
    command:
      - /bin/sh
      - -eu
      - -c
      - pgbackrest --stanza=primevest stanza-create && pgbackrest --stanza=primevest check
    volumes:
      - ${PRIMEVEST_DATA_ROOT:?PRIMEVEST_DATA_ROOT is required}/postgres:/var/lib/postgresql/data
    networks: [data, edge]
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,uid=70,gid=70,size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *operations-logging

  database-grants:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:?POSTGRES_MIGRATION_USER is required}
      POSTGRES_MONITOR_USER: ${POSTGRES_MONITOR_USER:?POSTGRES_MONITOR_USER is required}
    command:
      - /bin/sh
      - -eu
      - -c
      - >-
        psql
        --set=app_user="$$POSTGRES_APP_USER"
        --set=migration_user="$$POSTGRES_MIGRATION_USER"
        --set=monitor_user="$$POSTGRES_MONITOR_USER"
        --file=/sql/grant-runtime.sql
    volumes:
      - ./infrastructure/single-vps/grant-runtime.sql:/sql/grant-runtime.sql:ro
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.25
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *operations-logging

  backend:
    <<: *backend-runtime
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile

  backend-b:
    <<: *backend-runtime

  admin:
    mem_limit: 1g
    cpus: 1.0
    networks: [app, operations]
    depends_on:
      backend:
        condition: service_healthy
      backend-b:
        condition: service_healthy

  nginx:
    environment:
      STATUS_DOMAIN: ${STATUS_DOMAIN:?STATUS_DOMAIN is required}
      STATUS_ALLOW_CIDR: ${STATUS_ALLOW_CIDR:?STATUS_ALLOW_CIDR is required}
    networks: [edge, app, operations]
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      backend:
        condition: service_healthy
      backend-b:
        condition: service_healthy
      admin:
        condition: service_healthy
      grafana:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.4.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/single-vps/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/single-vps/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${PRIMEVEST_DATA_ROOT:?PRIMEVEST_DATA_ROOT is required}/prometheus:/prometheus
    networks: [app, operations]
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped
    depends_on: [node-exporter, cadvisor, postgres-exporter, redis-exporter]
    logging: *operations-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      [
        "--config.file=/etc/alertmanager/alertmanager.yml",
        "--storage.path=/alertmanager",
      ]
    volumes:
      - ./infrastructure/single-vps/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${PRIMEVEST_DATA_ROOT:?PRIMEVEST_DATA_ROOT is required}/alertmanager:/alertmanager
    networks: [operations]
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.25
    restart: unless-stopped
    logging: *operations-logging

  grafana:
    image: grafana/grafana:12.0.1
    environment:
      GF_SERVER_ROOT_URL: https://${STATUS_DOMAIN:?STATUS_DOMAIN is required}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
    volumes:
      - ${PRIMEVEST_DATA_ROOT:?PRIMEVEST_DATA_ROOT is required}/grafana:/var/lib/grafana
    networks: [operations]
    user: "472:472"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 1g
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *operations-logging

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./infrastructure/single-vps/loki.yml:/etc/loki/config.yml:ro
      - ${PRIMEVEST_DATA_ROOT:?PRIMEVEST_DATA_ROOT is required}/loki:/loki
    networks: [operations]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 0.5
    restart: unless-stopped
    logging: *operations-logging

  promtail:
    image: grafana/promtail:3.5.0
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./infrastructure/single-vps/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ${PRIMEVEST_DATA_ROOT:?PRIMEVEST_DATA_ROOT is required}/promtail:/run/promtail
    networks: [operations]
    user: "0:0"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.25
    restart: unless-stopped
    depends_on: [loki]
    logging: *operations-logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      [
        "--path.rootfs=/host",
        "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)",
      ]
    volumes:
      - /:/host:ro,rslave
    networks: [operations]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped
    logging: *operations-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    devices: [/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [operations]
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    logging: *operations-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_MONITOR_USER:?POSTGRES_MONITOR_USER is required}:${POSTGRES_MONITOR_PASSWORD:?POSTGRES_MONITOR_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
    networks: [data, operations]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    logging: *operations-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks: [data, operations]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    logging: *operations-logging

  backup-tool:
    image: restic/restic:0.18.0
    profiles: [backup]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?RESTIC_REPOSITORY is required}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?RESTIC_PASSWORD is required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
    volumes:
      - ${PRIMEVEST_DATA_ROOT:?PRIMEVEST_DATA_ROOT is required}/backups:/backup:ro
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 1g
    cpus: 0.5
    restart: "no"
    logging: *operations-logging

networks:
  operations:
    internal: true
