groups:
  - name: single-vps-host
    rules:
      - alert: HostCpuSustainedHigh
        expr: 100 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 70
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "VPS CPU has exceeded 70% for 10 minutes" }
      - alert: HostMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 75
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "VPS memory usage exceeds 75%" }
      - alert: HostDiskCritical
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 90
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "VPS disk usage exceeds 90%" }
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          { summary: "A monitored PrimeVest dependency is unreachable" }
  - name: single-vps-data
    rules:
      - alert: PostgreSQLConnectionsHigh
        expr: sum(pg_stat_activity_count) > 160
        for: 5m
        labels: { severity: warning }
        annotations:
          { summary: "PostgreSQL connections exceed 80% of configured maximum" }
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels: { severity: warning }
        annotations:
          { summary: "Redis memory exceeds 85% of its configured maximum" }
      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[5m]) > 0
        labels: { severity: critical }
        annotations: { summary: "Redis rejected one or more connections" }
