server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.zettax.app;
    ssl_certificate /etc/letsencrypt/live/zettax.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zettax.app/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/docs {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        client_max_body_size 6m;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.zettax.app;
    ssl_certificate /etc/letsencrypt/live/zettax.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zettax.app/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name status.zettax.app;
    ssl_certificate /etc/letsencrypt/live/zettax.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zettax.app/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zettax.app;
    ssl_certificate /etc/letsencrypt/live/zettax.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zettax.app/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }

    location /downloads/ {
        alias /var/www/zettax/downloads/;
    }

    location /updates/ {
        alias /var/www/zettax/updates/;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
