<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101619" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Zettax — Temporarily unavailable</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; color: #f5f7f7; background: radial-gradient(circle at 50% 2%, #263232 0, #141c1f 42%, #0b1114 100%); }
      main { width: min(100%, 680px); padding: clamp(32px, 7vw, 64px); border: 1px solid #354043; border-radius: 24px; background: rgba(18, 26, 29, .82); box-shadow: 0 24px 80px rgba(0, 0, 0, .25); }
      .brand { display: inline-flex; align-items: center; gap: 12px; color: #fff; font-size: 22px; font-weight: 750; letter-spacing: -.03em; }
      .mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; color: #181b19; background: #fcd535; font-size: 24px; font-style: italic; font-weight: 900; }
      .rule { width: 52px; height: 4px; margin: 68px 0 28px; border-radius: 4px; background: #fcd535; }
      h1 { max-width: 540px; margin: 0; font-size: clamp(38px, 7vw, 64px); line-height: 1.06; letter-spacing: -.055em; }
      p { max-width: 510px; margin: 22px 0 0; color: #afb9ba; font-size: clamp(16px, 2.5vw, 19px); line-height: 1.65; }
      footer { margin-top: 68px; color: #899597; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark" aria-hidden="true">Z</span><span>Zettax</span></div>
      <div class="rule" aria-hidden="true"></div>
      <h1>We’re taking a short break.</h1>
      <p>Zettax is temporarily unavailable while we carry out maintenance. Please check back later.</p>
      <footer>Thank you for your patience.</footer>
    </main>
  </body>
</html>
