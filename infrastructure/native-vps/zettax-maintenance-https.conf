# Temporary Zettax shutdown. Keep the other VPS sites and certificate renewal running.
# Restore zettax-https.conf and start the four Zettax services to reactivate.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zettax.app admin.zettax.app;
    ssl_certificate /etc/letsencrypt/live/zettax.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zettax.app/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /maintenance.html {
        internal;
        root /var/www/zettax;
    }

    location ^~ /api/ {
        default_type application/json;
        return 503 '{"code":"MAINTENANCE","message":"Zettax is temporarily unavailable."}';
    }

    location ^~ /socket.io/ {
        default_type application/json;
        return 503 '{"code":"MAINTENANCE","message":"Zettax is temporarily unavailable."}';
    }

    location / {
        error_page 503 /maintenance.html;
        return 503;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.zettax.app status.zettax.app;
    ssl_certificate /etc/letsencrypt/live/zettax.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zettax.app/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    default_type application/json;

    location / {
        return 503 '{"code":"MAINTENANCE","message":"Zettax is temporarily unavailable."}';
    }
}
