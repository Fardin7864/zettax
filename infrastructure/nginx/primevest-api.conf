limit_req_zone $binary_remote_addr zone=primevest_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=primevest_financial:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=primevest_api:10m rate=20r/s;

server {
    listen 80;
    server_name primevest.metablaast.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/primevest-acme;
        try_files $uri =404;
    }
    location / { return 301 https://primevest.metablaast.com$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name primevest.metablaast.com;
    ssl_certificate /etc/letsencrypt/live/primevest.metablaast.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primevest.metablaast.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 6m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /health { return 204; }
    location = /ready { return 404; }
    location ^~ /api/docs { return 404; }

    location ^~ /api/v1/auth/ {
        limit_req zone=primevest_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:4200;
        include proxy_params;
    }
    location ~ ^/api/v1/(funding|timed-contracts|orders|withdrawals|deposits) {
        limit_req zone=primevest_financial burst=10 nodelay;
        proxy_pass http://127.0.0.1:4200;
        include proxy_params;
    }
    location ^~ /api/ {
        limit_req zone=primevest_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4200;
        include proxy_params;
    }
    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
    }
    location / { return 404; }
}
