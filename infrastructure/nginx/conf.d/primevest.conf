upstream primevest_api {
  zone primevest_api 64k;
  least_conn;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server backend:3000 resolve max_fails=3 fail_timeout=10s;
  server backend-b:3000 resolve max_fails=3 fail_timeout=10s;
  keepalive 64;
}

upstream primevest_admin {
  zone primevest_admin 32k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server admin:3001 resolve max_fails=3 fail_timeout=10s;
  keepalive 16;
}

upstream primevest_status {
  zone primevest_status 32k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server grafana:3000 resolve max_fails=3 fail_timeout=10s;
  keepalive 16;
}

server {
  listen 8080 default_server;
  server_name ${API_DOMAIN} ${ADMIN_DOMAIN} ${STATUS_DOMAIN};

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 308 https://$host$request_uri;
  }
}

server {
  listen 8443 ssl;
  http2 on;
  server_name ${API_DOMAIN};

  ssl_certificate ${TLS_CERTIFICATE_PATH};
  ssl_certificate_key ${TLS_CERTIFICATE_KEY_PATH};
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:PrimeVestTLS:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

  location = /health {
    proxy_pass http://primevest_api/health;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
  }

  location ^~ /api/docs {
    return 404;
  }

  location ^~ /api/v1/auth/ {
    client_max_body_size 64k;
    limit_req zone=auth_per_ip burst=10 nodelay;
    limit_conn connections_per_ip 20;
    proxy_pass http://primevest_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location ~ ^/api/v1/(orders|positions|deposits|withdrawals|accounts/demo/reset) {
    client_max_body_size 64k;
    limit_req zone=financial_per_ip burst=10 nodelay;
    limit_conn connections_per_ip 20;
    proxy_pass http://primevest_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location ~ ^/api/v1/(kyc|uploads) {
    client_max_body_size 10m;
    limit_req zone=upload_per_ip burst=3 nodelay;
    limit_conn connections_per_ip 5;
    proxy_pass http://primevest_api;
    proxy_request_buffering on;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location ^~ /socket.io/ {
    limit_req zone=api_per_ip burst=20 nodelay;
    limit_conn connections_per_ip 10;
    proxy_pass http://primevest_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
  }

  location / {
    limit_req zone=api_per_ip burst=40 nodelay;
    limit_conn connections_per_ip 40;
    proxy_pass http://primevest_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
  }
}

server {
  listen 8443 ssl;
  http2 on;
  server_name ${STATUS_DOMAIN};

  ssl_certificate ${TLS_CERTIFICATE_PATH};
  ssl_certificate_key ${TLS_CERTIFICATE_KEY_PATH};
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:PrimeVestTLS:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location / {
    allow ${STATUS_ALLOW_CIDR};
    deny all;
    limit_req zone=api_per_ip burst=10 nodelay;
    limit_conn connections_per_ip 10;
    proxy_pass http://primevest_status;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
}

server {
  listen 8443 ssl;
  http2 on;
  server_name ${ADMIN_DOMAIN};

  ssl_certificate ${TLS_CERTIFICATE_PATH};
  ssl_certificate_key ${TLS_CERTIFICATE_KEY_PATH};
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:PrimeVestTLS:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location / {
    allow ${ADMIN_ALLOW_CIDR};
    deny all;
    limit_req zone=api_per_ip burst=20 nodelay;
    limit_conn connections_per_ip 20;
    proxy_pass http://primevest_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
  }
}
