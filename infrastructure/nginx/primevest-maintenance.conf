# Fail-closed HTTPS landing until the backend and release checks pass.
server {
    listen 80;
    server_name primevest.metablaast.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/primevest-acme;
        try_files $uri =404;
    }
    location / { return 301 https://primevest.metablaast.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name primevest.metablaast.com;
    ssl_certificate /etc/letsencrypt/live/primevest.metablaast.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primevest.metablaast.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 3600 always;
    location / {
        default_type application/json;
        return 503 '{"code":"PLATFORM_NOT_RELEASED","message":"PrimeVest deployment in progress"}';
    }
}
