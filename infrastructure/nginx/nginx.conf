worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;

events {
  worker_connections 8192;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method","host":"$host","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  server_tokens off;
  client_max_body_size 10m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 30s;

  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=financial_per_ip:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=upload_per_ip:10m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
  resolver 127.0.0.11 valid=30s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  include /etc/nginx/conf.d/*.conf;
}
