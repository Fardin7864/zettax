# Initial domain verification only. No customer or financial traffic is enabled.
server {
    listen 80;
    server_name primevest.metablaast.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/primevest-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type application/json;
        add_header Retry-After 3600 always;
        return 503 '{"code":"PLATFORM_NOT_RELEASED","message":"PrimeVest deployment in progress"}';
    }
}
