<head>

    This is a placeholder for base href that will be replaced by the value of

  -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Explore markets, study interactive charts, and practice trading with virtual funds on Zettax. Trade on web or download the Android app.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Zettax — Explore. Practice. Trade.">
  <meta property="og:description" content="Explore markets and practice trading with virtual funds on web or Android.">
  <meta property="og:image" content="https://zettax.app/landing-hero.png">
  <meta name="theme-color" content="#1C1C1C">
  <meta name="google-signin-client_id" content="938817876407-ennda3vg5g7vqdv8usfmv44is2pbnhk1.apps.googleusercontent.com">
  <meta name="google-site-verification" content="WyFKNpimgugFo3IENxW_6S16skCevGO6MpfqaysSngU">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Zettax">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Zettax</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.zettaxTrackDownload = function (source) {
      var deviceType = /iPad|iPhone|iPod/i.test(navigator.userAgent)
        ? 'ios'
        : /Android/i.test(navigator.userAgent) ? 'android' : 'desktop';
      var event = {
        event: source === 'navbar' ? 'navbar_download_clicked' : 'download_clicked',
        source: source,
        deviceType: deviceType,
        currentPath: location.pathname
      };
      // Same-origin, best-effort event delivery. Never include account details.
      try {
        var body = new Blob([JSON.stringify(event)], {type: 'application/json'});
        if (!navigator.sendBeacon || !navigator.sendBeacon('/api/v1/site-events', body)) {
          fetch('/api/v1/site-events', {method: 'POST', body: body, keepalive: true});
        }
      } catch (_) {}
    };
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
