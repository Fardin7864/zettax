name: primevest_mobile
description: Zettax mobile trading application
publish_to: none
version: 0.2.6+8

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  intl: ^0.20.2
  socket_io_client: 3.1.3
  google_sign_in: 7.2.0
  google_sign_in_web: 1.1.3
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/mock/instruments.json
    - assets/branding/zettax_mark.png
    - assets/branding/zettax_wordmark.png
    - assets/landing/market_energy.png
